name: Design OS evidence and authority contracts
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -X utf8 -B knowledge/ui-ux-frontend/scripts/test_learning.py
      - run: python -X utf8 -B knowledge/ui-ux-frontend/scripts/test_visual_review.py
      - run: python -X utf8 -B knowledge/video-production/scripts/test_contract.py
      - run: python -X utf8 -B knowledge/video-production/scripts/test_creative_diversity.py
