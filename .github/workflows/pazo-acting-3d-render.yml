name: PAZO original 3D acting short
on:
  push:
    branches: [media/pazo-acting-test-3d-20261029]
    paths:
      - 'video-renders/pazo_3d_acting_test.py'
      - 'video-renders/finish_pazo_3d_short.py'
      - '.github/workflows/pazo-acting-3d-render.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install real Blender renderer, FFmpeg and dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender ffmpeg fonts-dejavu-core
          python3 -m pip install --break-system-packages -q Pillow numpy cairosvg || true
          blender --version | head -3
      - name: Render actual 3D actor performance and four motivated camera shots
        run: |
          OPENBLAS_NUM_THREADS=1 blender --background --threads 4 --python video-renders/pazo_3d_acting_test.py -- --full
      - name: Sound edit, logo end card, MP4, contact-sheet and full decode
        run: |
          /usr/bin/python3 video-renders/finish_pazo_3d_short.py
      - name: Package editable scene and final media
        uses: actions/upload-artifact@v4
        with:
          name: PAZO-Original-3D-Acting-Test
          path: |
            video-renders/delivery/acting_3d/PAZO_Acting_Test_Original_3D.mp4
            video-renders/delivery/acting_3d/PAZO_Acting_Test_Storyboard.jpg
            video-renders/delivery/acting_3d/PAZO_3D_acting_test.blend
            video-renders/delivery/acting_3d/PRODUCTION_NOTES.txt
          if-no-files-found: error
      - name: Deliver MP4 and storyboard on separate media branch
        run: |
          git config user.name 'pazo-video-production-bot'
          git config user.email 'pazo-video-production-bot@users.noreply.github.com'
          git add -f video-renders/delivery/acting_3d/PAZO_Acting_Test_Original_3D.mp4 video-renders/delivery/acting_3d/PAZO_Acting_Test_Storyboard.jpg video-renders/delivery/acting_3d/PRODUCTION_NOTES.txt
          git commit -m 'media: fully rendered original rigged 3D short test' || true
          git push
